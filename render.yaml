services:
  - type: web
    name: KKI-salary-and-attendance-system
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        sync: false
      - key: MASTER_PASSWORD
        sync: false
      - key: PAYROLL_PASSWORD
        sync: false
      - key: TOTP_SECRET
        sync: false
